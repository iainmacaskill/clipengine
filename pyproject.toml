[project]
name = "clipengine"
version = "0.1.0"
description = "Automated Twitch-to-Shorts clip pipeline: highlight detection, vertical editing, captioning, publishing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
download = ["yt-dlp>=2024.4"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "yt-dlp>=2024.4"]

[project.scripts]
clipengine = "clipengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipengine*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
